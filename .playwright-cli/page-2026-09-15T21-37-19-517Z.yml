    - region "Saree and South Asian textile history timeline" [ref=f7e138]:
      - article [ref=f7e139]:
        - text: ✦
        - img "Hand-drawn interpretation of an early South Asian unstitched cotton drape" [ref=f7e141]
        - generic [ref=f7e142]:
          - time [ref=f7e143]: c. 4000 BCE onward
          - heading "Cloth before the modern sari" [level=3] [ref=f7e144]
          - paragraph [ref=f7e145]: India’s handmade textile history reaches back at least six millennia. Ancient cotton knowledge preceded the garment we now call the saree, which emerged gradually from traditions of wrapped, unstitched cloth.
          - text: "Try this: notice how one length becomes architecture on the body."
      - article [ref=f7e146]:
        - text: ✦
        - img "Hand-drawn interpretation of fine figured muslin in a historic Dhaka weaving setting" [ref=f7e148]
        - generic [ref=f7e149]:
          - time [ref=f7e150]: 16th–17th centuries
          - heading "Courts, workshops and fine muslin" [level=3] [ref=f7e151]
          - paragraph [ref=f7e152]: Under Mughal patronage, regional workshops and established crafts reached wider markets. Bengal’s extraordinarily fine cottons and figured muslins became celebrated far beyond the subcontinent.
          - text: "Look closer: Jamdani motifs are woven—not embroidered."
      - article [ref=f7e153]:
        - text: ✦
        - img "Hand-drawn Baluchari saree with narrative woven pallu" [ref=f7e155]
        - generic [ref=f7e156]:
          - time [ref=f7e157]: 18th–19th centuries
          - heading "Narratives enter the pallu" [level=3] [ref=f7e158]
          - paragraph [ref=f7e159]: Baluchari developed as a celebrated Bengal silk tradition, its pallus arranged like woven picture galleries. Museum records preserve regional silk, brocade and cotton sarees from this era.
          - text: "Decode it: a pallu can be read like a graphic novel."
      - article [ref=f7e160]:
        - text: ✦
        - img "Hand-drawn contemporary South Asian woman artisan weaving at a wooden handloom" [ref=f7e162]
        - generic [ref=f7e163]:
          - time [ref=f7e164]: 19th–20th centuries
          - heading "Industry, resistance and survival" [level=3] [ref=f7e165]
          - paragraph [ref=f7e166]: Mechanised production transformed textile markets, yet handmade cloth endured. During the freedom movement, khadi and hand-spinning became expressions of self-reliance and political identity.
          - text: "Ask of every saree: handloom or powerloom—and how do we know?"
      - article [ref=f7e167]:
        - text: ✦
        - img "Hand-drawn close view of Jamdani motifs being woven by hand" [ref=f7e169]
        - generic [ref=f7e170]:
          - time [ref=f7e171]: "2013"
          - heading "Jamdani recognised by UNESCO" [level=3] [ref=f7e172]
          - paragraph [ref=f7e173]: UNESCO inscribed Bangladesh’s traditional art of Jamdani weaving. Motifs are formed directly on the loom through a labour-intensive discontinuous-weft technique transmitted within weaving communities.
          - text: "Human signature: tiny variations reveal the rhythm of the hand."
      - article [ref=f7e174]:
        - text: ✦
        - img "Illustrated woman in a Tangail saree beside a traditional loom" [ref=f7e176]
        - generic [ref=f7e177]:
          - time [ref=f7e178]: "2025"
          - heading "Tangail joins the living-heritage list" [level=3] [ref=f7e179]
          - paragraph [ref=f7e180]: Traditional saree weaving art of Tangail, Bangladesh, joined UNESCO’s Representative List—recognition of a tradition kept alive through practice and transmission.
          - text: "Your chapter: wear, repeat, ask, remember, pass on."
