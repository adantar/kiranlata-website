        - paragraph [ref=f1e46]: Crisp, enduring and unmistakably grounded in place.
      - generic [ref=f1e47]:
        - paragraph [ref=f1e48]: Dhaniakhali is a traditional cotton handloom saree from the Hooghly district of West Bengal, with a weaving heritage that stretches back generations. Known for its crisp cotton, distinctive borders, and everyday elegance, the saree developed around the weaving communities of Dhaniakhali and the surrounding villages.
        - paragraph [ref=f1e49]: Originally valued as a practical cotton saree for Bengal’s warm climate, Dhaniakhali became known for its durability, comfort, and understated beauty. Traditionally woven on handlooms, its character comes from the slight texture of the cloth and the rhythm of the woven border rather than elaborate ornamentation.
        - paragraph [ref=f1e50]: Today, Dhaniakhali remains part of Bengal’s living handloom tradition and is protected by a Geographical Indication (GI) tag, recognizing its connection to the region and its weaving heritage.
